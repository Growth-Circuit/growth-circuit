name: PR build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Buzz PR alert lifecycle
        run: .github/scripts/test-buzz-pr-alert.sh

      - name: Run unit tests
        run: npm run test

      - name: Start local Supabase
        run: npx supabase start

      - name: Export local community environment
        run: |
          eval "$(npx supabase status -o env)"
          echo "PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "COMMUNITY_E2E_MODE=true" >> "$GITHUB_ENV"
          echo "COMMUNITY_FEATURE_ENABLED=true" >> "$GITHUB_ENV"
          echo "COMMUNITY_KILL_SWITCH=false" >> "$GITHUB_ENV"
          echo "PUBLIC_PROFILES_ENABLED=true" >> "$GITHUB_ENV"

      - name: Run database policy tests
        run: npm run test:db

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
