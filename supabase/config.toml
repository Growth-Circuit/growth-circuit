extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["http://localhost:4321/**", "http://127.0.0.1:4321/**"]
enable_signup = true

[storage]
enabled = true
file_size_limit = "5MiB"
